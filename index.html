<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI × 飞鸟保护 | 让 AI 看见飞鸟，让科技守护自然</title>
  <link rel="stylesheet" href="_shared/css/style.css">
  <style>
    body { padding-top: 0 !important; }
    .hero { margin-top: 0; }

    /* 飞鸟剪影 SVG */
    .hero-bird svg { width: 40px; height: 40px; }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div id="story-nav-placeholder"></div>

  <!-- Hero 区域 -->
  <section class="hero" style="margin-top: calc(var(--nav-height) + 44px);">
    <div class="hero-bg"></div>
    <div class="hero-birds" id="heroBirds"></div>
    <div class="hero-content">
      <h1>当 AI 遇见飞鸟</h1>
      <p class="hero-subtitle">让科技看见每一次迁徙，让保护发生在每一个角落。</p>
      <div class="hero-buttons">
        <a href="birds.html" class="btn btn-secondary btn-lg">认识飞鸟</a>
        <a href="protection.html" class="btn btn-secondary btn-lg">探索保护地</a>
        <a href="ai-protection.html" class="btn btn-secondary btn-lg">AI 如何保护飞鸟</a>
      </div>
    </div>
  </section>

  <!-- 为什么保护飞鸟 -->
  <section class="section">
    <div class="container">
      <div class="section-header" data-animate>
        <span class="section-tag">飞鸟为什么重要</span>
        <h2>每一种飞鸟，都是生态系统中不可替代的一员</h2>
        <p>飞鸟不仅是天空的精灵，更是生态平衡的守护者、环境变化的指示器。</p>
      </div>
      <div class="fact-cards">
        <div class="fact-card" data-animate>
          <div class="fact-icon">🌿</div>
          <h3>生态系统</h3>
          <p>飞鸟参与食物链、种子传播和生态平衡，是维持生态系统稳定的关键环节。</p>
        </div>
        <div class="fact-card" data-animate>
          <div class="fact-icon">🌏</div>
          <h3>环境指标</h3>
          <p>鸟类种群变化可以反映生态环境变化，是监测生态系统健康的天然指示器。</p>
        </div>
        <div class="fact-card" data-animate>
          <div class="fact-icon">🧬</div>
          <h3>生物多样性</h3>
          <p>每一种鸟都是生态系统中的重要成员，保护鸟类就是保护生物多样性的根基。</p>
        </div>
      </div>
      <div class="intro-bridge" data-animate>
        <h3>但我们真的了解它们吗？</h3>
        <p>认识飞鸟，是保护的第一步。</p>
        <a href="birds.html" class="btn btn-primary" style="margin-top: 16px;">进入飞鸟图鉴 →</a>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <script src="_shared/js/birds-data.js"></script>
  <script src="_shared/js/nav.js"></script>
  <script>
    initCommon('index', -1);

    // 生成飞鸟剪影动画
    const heroBirds = document.getElementById('heroBirds');
    const birdPath = '<path d="M10,20 Q15,15 20,18 L28,14 Q35,12 38,16 L32,22 Q25,26 18,23 L8,28 Z" fill="white"/>';

    for (let i = 0; i < 6; i++) {
      const bird = document.createElement('div');
      bird.className = 'hero-bird';
      bird.style.top = (10 + Math.random() * 60) + '%';
      bird.style.animationDelay = (Math.random() * 25) + 's';
      bird.style.animationDuration = (20 + Math.random() * 15) + 's';
      bird.innerHTML = `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">${birdPath}</svg>`;
      heroBirds.appendChild(bird);
    }
  </script>
</body>
</html>
